name: Android CI and Release

# Every push to main and every pull request runs the full quality gate.
# Whenever the build job produces its artifacts, they are PUBLISHED automatically
# as a GitHub Release (no manual step):
#   - push to main  -> pre-release tagged build-<run number>
#   - tag v0.1.0    -> release (tag must equal "version" in src-tauri/tauri.conf.json)
#   - manual run    -> pre-release tagged build-<run number>
# Pull requests only build and upload the workflow artifact; they never publish.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CI: "true"
  NODE_VERSION: "22"
  FORCE_COLOR: "1"
  # The app computes business dates in IST; run tests in the same zone.
  TZ: "Asia/Kolkata"
  # Hard size gates: the build fails (and nothing is published) above these.
  MAX_INSTALLER_MB: "10"   # Windows setup.exe
  MAX_APK_MB: "75"         # each Android APK (one per CPU architecture)

jobs:
  # ---------------------------------------------------------------------------
  # 1. Frontend gate: typecheck, lint, unit tests, seeder/load-test checks, build
  # ---------------------------------------------------------------------------
  quality:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Tag must match the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json version $VERSION"
            exit 1
          fi

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (exact lockfile)
        run: npm ci --no-audit --no-fund

      - name: Typecheck (app + scripts)
        run: npm run typecheck:all

      # Check only: CI never rewrites or pushes code. Run `npm run format` locally.
      - name: Lint (ESLint + Prettier)
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      - name: Math, section and seeder checks
        run: |
          npm run verify:math
          npm run verify:sections

      - name: Load tests (light + medium)
        run: |
          npm run verify:loadtest:light
          npm run verify:loadtest:medium

      - name: Production web build
        run: npm run build

      - name: Build output must exist
        run: test -s .output/public/index.html

  # ---------------------------------------------------------------------------
  # 2. Rust gate: the Tauri shell and the android-save plugin
  # ---------------------------------------------------------------------------
  rust:
    name: Rust check and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6

      - name: Linux system libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libdbus-1-dev libsecret-1-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri-build needs the frontendDist folder to exist; the real build is
      # verified in the quality job, so a placeholder is enough here.
      - name: Placeholder frontend for tauri-build
        run: |
          mkdir -p .output/public
          echo '<!doctype html><title>ci</title>' > .output/public/index.html

      # --locked: the committed Cargo.lock is the source of truth. The build
      # fails if it is out of sync with Cargo.toml (fix: run `cargo update -w`
      # in src-tauri and commit Cargo.lock), so releases are reproducible.
      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked --all-targets

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

      # Advisory only: differences become a warning annotation, not a failure.
      # Make these strict by removing the "|| echo" parts.
      - name: cargo fmt (advisory)
        working-directory: src-tauri
        run: cargo fmt --all -- --check || echo "::warning::rustfmt found formatting differences (advisory)"

      - name: cargo clippy (advisory)
        working-directory: src-tauri
        run: cargo clippy --all-targets || echo "::warning::clippy reported problems (advisory)"

  # ---------------------------------------------------------------------------
  # 3. Build the Android APK (only after both gates pass)
  # ---------------------------------------------------------------------------
  build-android:
    name: Build Android APK
    needs: [quality, rust]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      NDK_VERSION: "27.2.12479018"
      # "true" when the signing secrets are configured. Otherwise the release
      # APKs are signed with a temporary CI key (installable, not updatable).
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      # The NDK is ~1 GB: cache it so it is not downloaded on every run.
      - name: Cache Android NDK
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/${{ env.NDK_VERSION }}
          key: android-ndk-${{ env.NDK_VERSION }}

      # ubuntu-latest already ships the Android SDK (ANDROID_HOME) and
      # sdkmanager. android-actions/setup-android tries to re-install "tools"
      # on top of it and fails, so use the preinstalled SDK directly.
      - name: Prepare Android SDK and NDK
        run: |
          set -euo pipefail
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKM=$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -n1)
          echo "Using $SDKM"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" --install "ndk;${NDK_VERSION}"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies (exact lockfile)
        run: npm ci --no-audit --no-fund

      # Caches Gradle dependencies and wrapper between runs (saves each build
      # re-downloading them). Write access to the cache only on main/tags.
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

      # Android only accepts an APK as an update if its versionCode is higher
      # than the installed one. Tauri derives it from "version" (0.1.0 -> 1000),
      # so every build had the same code. Use the CI run number instead
      # (always increasing; starts above the old fixed 1000).
      - name: Set Android versionCode from the run number
        run: |
          set -euo pipefail
          CODE=$((1000 + GITHUB_RUN_NUMBER))
          jq --argjson c "$CODE" '.bundle.android.versionCode = $c' src-tauri/tauri.conf.json > /tmp/tauri.conf.json
          mv /tmp/tauri.conf.json src-tauri/tauri.conf.json
          echo "versionCode = $CODE"

      - name: Generate the Android project
        run: npx tauri android init --ci

      # `tauri android init` ignores src-tauri/icons/android and ships the
      # default launcher icons; `tauri icon` only writes into gen/ when it
      # already exists. gen/ is regenerated in CI, so copy the committed
      # custom icon set into the generated project.
      - name: Apply custom launcher icons
        run: |
          set -euo pipefail
          SRC=src-tauri/icons/android
          RES=src-tauri/gen/android/app/src/main/res
          test -d "$SRC" || { echo "::error::$SRC is missing"; exit 1; }
          test -d "$RES" || { echo "::error::$RES was not generated"; exit 1; }
          # A template .webp next to our .png would be a duplicate resource.
          rm -f "$RES"/mipmap-*/ic_launcher*.webp
          cp -rf "$SRC"/. "$RES"/
          # Verify every custom icon landed byte-for-byte.
          fail=0
          while IFS= read -r -d '' f; do
            rel="${f#"$SRC"/}"
            cmp -s "$f" "$RES/$rel" || { echo "::error::icon not applied: $rel"; fail=1; }
          done < <(find "$SRC" -type f -print0)
          [ "$fail" -eq 0 ] || exit 1
          grep -q "@mipmap/ic_launcher" src-tauri/gen/android/app/src/main/AndroidManifest.xml \
            || echo "::warning::AndroidManifest.xml does not reference @mipmap/ic_launcher"
          echo "Launcher icons applied from $SRC ($(find "$SRC" -type f | wc -l) files)"

      # Safety net for R8 (release minification): Tink, pulled in by
      # androidx.security:security-crypto, references annotation classes that
      # are not in the APK. The plugin's consumer rules already ignore them;
      # this duplicates that in the generated app so a regenerated project can
      # never lose it.
      - name: R8 keep/dontwarn rules for the generated app
        run: |
          cat >> src-tauri/gen/android/app/proguard-rules.pro <<'EOF'
          -dontwarn javax.annotation.**
          -dontwarn javax.annotation.concurrent.**
          -dontwarn com.google.errorprone.annotations.**
          -dontwarn org.checkerframework.**
          EOF

      # Always an optimized RELEASE build (a debug build is 10x larger), split
      # into one APK per CPU architecture so each device downloads only its own.
      - name: Build release APKs (split per ABI)
        run: npx tauri android build --apk --split-per-abi --target aarch64 --target armv7

      - name: Upload R8 diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: r8-diagnostics
          path: src-tauri/gen/android/app/build/outputs/mapping/**/*.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Zipalign, sign and verify each APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          # Non-tag builds carry the short commit id so each build is identifiable.
          SUFFIX=""; [ "${GITHUB_REF_TYPE}" = "tag" ] || SUFFIX="-${GITHUB_SHA::7}"
          mkdir -p dist work
          if [ "$HAS_KEYSTORE" = "true" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > work/release.jks
            KS_ALIAS="$ANDROID_KEY_ALIAS"
            KS_PASS="$ANDROID_KEYSTORE_PASSWORD"
            KEY_PASS="$ANDROID_KEY_PASSWORD"
          else
            # No secrets configured: sign with a throw-away key so the APK is
            # installable. A new key every run means a new run's APK cannot
            # update an older install; add the four ANDROID_* secrets to fix.
            KS_ALIAS=ci
            KS_PASS=$(openssl rand -hex 16)
            KEY_PASS="$KS_PASS"
            keytool -genkeypair -keystore work/release.jks -alias "$KS_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$KS_PASS" -keypass "$KEY_PASS" -dname "CN=Truff Snacks CI"
            echo "Signed with a temporary CI key. Uninstall any older build before installing; add the ANDROID_* signing secrets for updatable releases." > dist/SIGNING-NOTE.txt
          fi
          export KS_PASS KEY_PASS
          mapfile -t APKS < <(find src-tauri/gen/android -name '*release-unsigned.apk' | sort)
          test "${#APKS[@]}" -gt 0
          for APK in "${APKS[@]}"; do
            base=$(basename "$APK" -release-unsigned.apk)
            abi=${base#app-}
            "$BT/zipalign" -p -f 4 "$APK" "work/${abi}.apk"
            OUT="dist/truff-android-v${VERSION}${SUFFIX}-${abi}.apk"
            "$BT/apksigner" sign --ks work/release.jks --ks-key-alias "$KS_ALIAS" \
              --ks-pass env:KS_PASS --key-pass env:KEY_PASS --out "$OUT" "work/${abi}.apk"
            "$BT/apksigner" verify "$OUT"
          done
          rm -rf work

      - name: APK size report and gate
        run: |
          set -uo pipefail
          fail=0
          { echo "### Android APK sizes (limit ${MAX_APK_MB} MB each)"; echo; echo "| APK | MB |"; echo "|---|---|"; } >> "$GITHUB_STEP_SUMMARY"
          for f in dist/*.apk; do
            bytes=$(stat -c%s "$f")
            mb=$(awk -v b="$bytes" 'BEGIN{printf "%.2f", b/1048576}')
            echo "$(basename "$f"): ${mb} MB"
            echo "| $(basename "$f") | ${mb} |" >> "$GITHUB_STEP_SUMMARY"
            echo "--- largest entries in $(basename "$f")"
            unzip -lv "$f" | awk 'NR>3 && $1 ~ /^[0-9]+$/ {print $3, $8}' | sort -nr | sed -n 1,12p | awk '{printf "%8.2f MB  %s\n", $1/1048576, $2}'
            if [ "$bytes" -gt $((MAX_APK_MB * 1048576)) ]; then
              echo "::error::$(basename "$f") is ${mb} MB, above the ${MAX_APK_MB} MB limit"
              fail=1
            fi
          done
          exit $fail

      - name: Checksums
        run: |
          cd dist
          ls -l
          sha256sum *.apk > SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        if: always() && hashFiles('dist/*') != ''
        with:
          name: android-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 4. Publish (runs only if EVERYTHING above succeeded)
  # ---------------------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    needs: [quality, rust, build-android]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: android-apk
          path: dist

      - name: Release name and type
        id: rel
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
          if [ -f dist/SIGNING-NOTE.txt ]; then
            echo "pre=true" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_TYPE}" != "tag" ] || [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "pre=true" >> "$GITHUB_OUTPUT"
          else
            echo "pre=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Truff Snacks Android ${{ steps.rel.outputs.tag }}
          prerelease: ${{ steps.rel.outputs.pre == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
            dist/SIGNING-NOTE.txt

      # Keep the 10 newest build-N pre-releases; delete older ones and their tags.
      - name: Prune old build pre-releases
        if: github.ref_type != 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 200 --json tagName \
            --jq '[.[] | select(.tagName | startswith("build-"))] | .[10:] | .[].tagName' \
          | while read -r tag; do
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --cleanup-tag --yes || true
            done
