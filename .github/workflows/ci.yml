name: Android CI and Release

# Every push to main and every pull request runs the full quality gate.
# Publishing a GitHub Release happens ONLY when every job below succeeded AND
#   - a tag like v0.1.0 is pushed (must equal "version" in src-tauri/tauri.conf.json), or
#   - the workflow is started manually with "publish" ticked.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish a GitHub Release if every check passes"
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  CI: "true"
  NODE_VERSION: "22"
  FORCE_COLOR: "1"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Frontend gate: typecheck, lint, unit tests, seeder/load-test checks, build
  # ---------------------------------------------------------------------------
  quality:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Tag must match the app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "${GITHUB_REF_NAME#v}" != "$VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match tauri.conf.json version $VERSION"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies (exact lockfile)
        run: npm ci --no-audit --no-fund

      - name: Typecheck (app + scripts)
        run: npm run typecheck:all

      - name: Lint (ESLint + Prettier)
        run: npm run lint

      - name: Unit tests (Vitest)
        run: npm test

      - name: Math, section and seeder checks
        run: |
          npm run verify:math
          npm run verify:sections

      - name: Load tests (light + medium)
        run: |
          npm run verify:loadtest:light
          npm run verify:loadtest:medium

      - name: Production web build
        run: npm run build

      - name: Build output must exist
        run: test -s .output/public/index.html

  # ---------------------------------------------------------------------------
  # 2. Rust gate: the Tauri shell and the android-save plugin
  # ---------------------------------------------------------------------------
  rust:
    name: Rust check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libssl-dev libdbus-1-dev libsecret-1-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri-build needs the frontendDist folder to exist; the real build is
      # verified in the quality job, so a placeholder is enough here.
      - name: Placeholder frontend for tauri-build
        run: |
          mkdir -p .output/public
          echo '<!doctype html><title>ci</title>' > .output/public/index.html

      - name: cargo check
        working-directory: src-tauri
        run: cargo check --locked --all-targets

      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked

      # Advisory only: reported in the log but not a gate. Remove
      # "continue-on-error" once the Rust code is clean under both.
      - name: cargo fmt (advisory)
        continue-on-error: true
        working-directory: src-tauri
        run: cargo fmt --all -- --check

      - name: cargo clippy (advisory)
        continue-on-error: true
        working-directory: src-tauri
        run: cargo clippy --locked --all-targets

  # ---------------------------------------------------------------------------
  # 3. Build the Android APK (only after both gates pass)
  # ---------------------------------------------------------------------------
  build-android:
    name: Build Android APK
    needs: [quality, rust]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NDK_VERSION: "27.2.12479018"
      # "true" when the signing secrets are configured -> signed release APK.
      # Otherwise a debug-signed APK is built (installable, not for Play Store).
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;${NDK_VERSION}"
          echo "NDK_HOME=$ANDROID_HOME/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies (exact lockfile)
        run: npm ci --no-audit --no-fund

      - name: Generate the Android project
        run: npx tauri android init --ci

      - name: Build signed release APK
        if: env.HAS_KEYSTORE == 'true'
        run: npx tauri android build --apk --target aarch64 --target armv7

      - name: Build debug APK (no signing secrets configured)
        if: env.HAS_KEYSTORE != 'true'
        run: npx tauri android build --apk --debug --target aarch64 --target armv7

      - name: Sign, align and verify release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)
          APK=$(find src-tauri/gen/android -name '*release-unsigned.apk' | head -n1)
          test -n "$APK"
          mkdir -p dist
          "$BT/zipalign" -p -f 4 "$APK" aligned.apk
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > release.jks
          OUT="dist/truff-android-v${VERSION}.apk"
          "$BT/apksigner" sign --ks release.jks --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$OUT" aligned.apk
          "$BT/apksigner" verify --verbose "$OUT"
          rm -f release.jks aligned.apk

      - name: Collect debug APK
        if: env.HAS_KEYSTORE != 'true'
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          APK=$(find src-tauri/gen/android -name '*debug.apk' | head -n1)
          test -n "$APK"
          mkdir -p dist
          cp "$APK" "dist/truff-android-v${VERSION}-debug.apk"

      - name: Checksums
        run: |
          cd dist
          ls -l
          sha256sum *.apk > SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  # ---------------------------------------------------------------------------
  # 4. Publish (runs only if EVERYTHING above succeeded)
  # ---------------------------------------------------------------------------
  publish:
    name: Publish GitHub Release
    needs: [quality, rust, build-android]
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: dist

      - name: Release name and type
        id: rel
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=build-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          fi
          if ls dist/*-debug.apk >/dev/null 2>&1; then
            echo "pre=true" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_TYPE}" != "tag" ] || [[ "${GITHUB_REF_NAME}" == *-* ]]; then
            echo "pre=true" >> "$GITHUB_OUTPUT"
          else
            echo "pre=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.rel.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Truff Snacks Android ${{ steps.rel.outputs.tag }}
          prerelease: ${{ steps.rel.outputs.pre == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/*.apk
            dist/SHA256SUMS.txt
